<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title>KChart</title>
    <!-- <script src="https://unpkg.com/lightweight-charts@5.0.6/dist/lightweight-charts.standalone.production.js"></script> -->

    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <style>

        font-family: "iconfont";
        src: url("./iconfont/iconfont.eot");

      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0px;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      #sell-layer {
        left: 16px;
        top: 10px;
        position: absolute;
        display: none;

        flex-direction: row;
        align-items: center;
        z-index: 1000;
      }

      #container {
        background-color: transparent !important;
      }

      #container canvas {
        background-color: transparent !important;
      }

      #summary-layer {
        position: absolute;
        z-index: 1000;
        left: 0;
        right: 0;
        top: 0;
        min-height: 56px;
        padding: 8px 12px 7px;
        box-sizing: border-box;
        background: #fff;
        color: #242424;
        font:
          12px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          Arial,
          sans-serif;
        pointer-events: none;
      }
      #summary-layer .summary-row {
        display: flex;
        align-items: center;
        min-height: 22px;
      }
      #summary-layer .summary-item {
        flex: 1;
        white-space: nowrap;
      }
      #summary-layer .summary-label {
        color: rgba(36, 36, 36, 0.6);
        margin-right: 5px;
      }
      #summary-layer .summary-value {
        color: #16b978;
      }
      #summary-layer .summary-fall {
        color: #eb4b6d;
      }
      #summary-layer .summary-yellow {
        color: #ff9b18;
      }
      #summary-layer .summary-time {
        color: rgba(36, 36, 36, 0.7);
        margin-right: 7px;
      }
    </style>
  </head>

  <body>
    <div id="container" style="width: 100%; height: 100%">
      <div id="summary-layer"></div>
      <div id="price-layer" class="custom-price-scale"></div>
    </div>
    <div id="sell-layer" class="custom-sell">
      <div
        style="
          width: 0px;
          height: 0px;
          background: rgba(235, 75, 109, 1);
          margin-right: 4px;
        "
      ></div>
      <div
        id="sell-layer-title"
        style="font-size: 12px; color: rgba(13, 12, 34, 0.5)"
      ></div>
    </div>
  </body>

  <script type="text/javascript">
    // // 初始化 vConsole
    var vConsole = new VConsole();
    // console.log("Hello from vConsole");
  </script>
</html>
