    />
    <title>KChart</title>

      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0px;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      #sell-layer {
        left: 16px;
        top: 10px;
        position: absolute;
        display: none;

        flex-direction: row;
        align-items: center;
        z-index: 1000;
      }

      #container {
        background-color: transparent !important;
      }

      #container canvas {
        background-color: transparent !important;
      }
    </style>
  </head>

  <body>
    <div id="container" style="width: 100%; height: 100%">
      <div id="price-layer" class="custom-price-scale"></div>
    </div>
    <div id="sell-layer" class="custom-sell">
      <div
        style="
          width: 0px;
          height: 0px;
          background: rgba(235, 75, 109, 1);
          margin-right: 4px;
        "
      ></div>
      <div
        id="sell-layer-title"
        style="font-size: 12px; color: rgba(13, 12, 34, 0.5)"
      ></div>
    </div>
  </body>
